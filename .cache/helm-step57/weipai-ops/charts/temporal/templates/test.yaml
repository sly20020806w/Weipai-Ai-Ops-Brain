---
# Source: weipai-ops/charts/temporal/templates/test.yaml
apiVersion: v1
kind: Pod
metadata:
  namespace: "weipai-ops"
  name: "weipai-temporal-test-cluster-health"
  labels:
    app.kubernetes.io/component: test
    app.kubernetes.io/name: temporal
    helm.sh/chart: temporal-1.7.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: weipai
    app.kubernetes.io/version: "1.32.0"
    app.kubernetes.io/part-of: temporal
  annotations:
    "helm.sh/hook": test
spec:
  serviceAccountName: weipai-temporal
  containers:
  - name: cluster-health
    image: "temporalio/admin-tools:1.31.0"
    imagePullPolicy: IfNotPresent
    command: ["temporal", "operator", "cluster", "health"]
    env:
      - name: TEMPORAL_ADDRESS
        value: weipai-temporal-frontend:7233
  restartPolicy: Never
