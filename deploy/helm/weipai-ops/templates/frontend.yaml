apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weipai.name" . }}-frontend
  labels:
    {{- include "weipai.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: weipai-ops, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend}
  template:
    metadata:
      labels:
        {{- include "weipai.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "weipai.name" . }}-console
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toJson . }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ .Values.images.frontend | quote }}
          securityContext:
            {{- include "weipai.security" . | nindent 12 }}
          resources: {{ .Values.resources.frontend | toJson }}
          env:
            - name: API_UPSTREAM
              value: {{ printf "%s-api:8000" (include "weipai.name" .) | quote }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weipai.name" . }}-frontend
  labels:
    {{- include "weipai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/part-of: weipai-ops, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- if .Values.ingressEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "weipai.name" . }}
  labels:
    {{- include "weipai.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "660"
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls: [{secretName: {{ .Values.tlsSecret }}, hosts: [{{ .Values.publicHost | quote }}]}]
  rules:
    - host: {{ .Values.publicHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "weipai.name" . }}-frontend, port: {name: http}}
{{- end }}
